<VirtualHost *:80>
    DocumentRoot /usr/local/apache2/htdocs
    ServerName baischer-fleischerei-catering.com

    # Reverse-proxy the Symfony backend (public JSON API, the admin dashboard,
    # and the static assets it publishes for EasyAdmin) through this same
    # container/origin, so the external setup in front of `web` doesn't need
    # to change and the browser never has to deal with CORS.
    ProxyPreserveHost On
    ProxyPass /api http://api:80/api
    ProxyPassReverse /api http://api:80/api
    ProxyPass /admin http://api:80/admin
    ProxyPassReverse /admin http://api:80/admin
    ProxyPass /bundles http://api:80/bundles
    ProxyPassReverse /bundles http://api:80/bundles
    ProxyPass /uploads http://api:80/uploads
    ProxyPassReverse /uploads http://api:80/uploads

    <Directory /usr/local/apache2/htdocs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # Serve existing files/directories as-is
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        # Fall back to index.html for Vue Router (history mode)
        RewriteRule ^ index.html [L]
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
